<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin|BM400 Cibubur|Digital Library System</title>
  
  <script>
    if (!sessionStorage.getItem('rnx_admin_auth')) {
      alert('⚠️ Akses ditolak! Anda harus memindai QR Admin yang sah di halaman utama terlebih dahulu.');
      window.location.replace('index(4).html');
    }
  </script>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #6366f1;
      --primary-light: #1e1b4b;
      --success: #10b981;
      --success-light: #064e3b;
      --warning: #f59e0b;
      --warning-light: #451a03;
      --danger: #ef4444;
      --danger-light: #450a0a;
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --radius: 16px;
    }

    [data-theme="light"] {
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --success: #10b981;
      --success-light: #ecfdf5;
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 24px 16px; }
    .container { max-width: 1000px; margin: 0 auto; }

    .nav-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; background: var(--card-bg); padding: 16px 20px;
      border-radius: var(--radius); border: 1px solid var(--border-color); gap: 12px;
    }

    .card {
      background: var(--card-bg); padding: 24px; border-radius: 20px;
      border: 1px solid var(--border-color); margin-bottom: 20px;
    }

    .sub-action-bar {
      display: flex; gap: 8px; margin-bottom: 18px; background: var(--bg-color);
      padding: 4px; border: 1px solid var(--border-color); border-radius: 12px;
    }
    .btn-sub-action {
      flex: 1; padding: 10px; border: none; background: transparent; font-weight: 700;
      font-size: 12px; color: var(--text-muted); border-radius: 9px; cursor: pointer;
    }
    .btn-sub-action.active { background: var(--card-bg); color: var(--primary); }

    .tab-content, .sub-tab-content { display: none; }
    .tab-content.active, .sub-tab-content.active { display: block; }

    .webcam-container {
      border: 2px solid var(--border-color); border-radius: var(--radius); padding: 6px;
      background: #000; margin-bottom: 14px; max-width: 400px; margin-left: auto; margin-right: auto; display: none;
    }
    .cam-box { width: 100%; height: 240px; border-radius: 10px; overflow: hidden; position: relative; }
    .cam-box video { width: 100% !important; height: 100% !important; object-fit: cover !important; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 13px; }
    input[type="text"], input[type="email"], input[type="date"], select {
      width: 100%; padding: 12px 14px; border: 1px solid var(--border-color);
      border-radius: var(--radius); font-size: 14px; outline: none; background: var(--bg-color); color: var(--text-main);
    }

    .btn-scan-sm {
      background: var(--warning-light); color: var(--warning); border: 1px solid var(--border-color);
      padding: 8px 12px; border-radius: 8px; font-weight: 700; font-size: 11px; cursor: pointer; margin-top: 6px; display: inline-block;
    }

    .btn {
      width: 100%; padding: 14px; border: none; border-radius: var(--radius);
      color: white; font-weight: 700; cursor: pointer; font-size: 14px;
    }
    .btn-buku { background: linear-gradient(135deg, #6366f1, #4f46e5); }
    .btn-secondary { background: #64748b; margin-top: 8px; }

    .alert { margin-top: 16px; padding: 12px 14px; border-radius: var(--radius); font-size: 13px; font-weight: 600; display: none; }
    .alert-success { background: var(--success-light); color: var(--success); }
    .alert-danger { background: var(--danger-light); color: var(--danger); }

    .table-container { border: 1px solid var(--border-color); border-radius: var(--radius); overflow-x: auto; background: var(--card-bg); margin-top: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
    th, td { padding: 10px 8px; border-bottom: 1px solid var(--border-color); }
    th { background-color: var(--bg-color); color: var(--text-muted); font-size: 10px; text-transform: uppercase; }
  </style>
</head>

<body>
  <div class="container">
    <div class="nav-header">
      <h1>⚙️ Admin Control Panel</h1>
      <div id="live-clock">🕒 Loading...</div>
      <a href="index(4).html" style="color:var(--text-main); text-decoration:none; font-weight:700;">← Back</a>
    </div>

    <div class="card">
      <div class="sub-action-bar">
        <button class="btn-sub-action active" id="btn-sub-addbook" onclick="switchSubTab('add')">➕ Tambah Buku</button>
        <button class="btn-sub-action" id="btn-sub-managebook" onclick="switchSubTab('manage')">📚 Kelola Buku</button>
      </div>

      <!-- TAB TAMBAH BUKU -->
      <div id="subtab-buku-add" class="sub-tab-content active">
        <h2 id="buku-form-title" style="margin-bottom:16px;">📚 Tambah Master Buku</h2>

        <div class="webcam-container" id="box-cam-buku">
          <div id="reader-admin-buku" class="cam-box"></div>
          <button type="button" class="btn btn-secondary" style="padding:6px; font-size:12px; margin-top:6px;" onclick="stopAdminCamera()">Tutup Kamera</button>
        </div>

        <form onsubmit="submitBuku(event)">
          <input type="hidden" id="form-mode-buku" value="add">
          
          <div class="form-group">
            <label>ISBN</label>
            <input type="text" id="isbn-buku" placeholder="Nomor ISBN buku...">
            <button type="button" class="btn-scan-sm" onclick="startAdminCamera('isbn')">📷 Scan ISBN</button>
          </div>

          <div class="form-group">
            <label>Book Code / No Induk (Unik per Fisik Buku)</label>
            <input type="text" id="barcode-buku" required placeholder="Kode unik fisik buku...">
            <button type="button" class="btn-scan-sm" onclick="startAdminCamera('barcode')">📷 Scan Book Code</button>
          </div>

          <div class="form-group">
            <label>Book Title</label>
            <input type="text" id="judul-buku" required placeholder="Judul buku...">
          </div>

          <div class="form-group">
            <label>Author</label>
            <input type="text" id="pengarang-buku" placeholder="Nama pengarang...">
          </div>

          <button type="submit" id="btn-submit-buku" class="btn btn-buku">Simpan Master Buku</button>
          <button type="button" id="btn-cancel-buku" class="btn btn-secondary" style="display: none;" onclick="resetBukuForm()">Batal Edit</button>
        </form>
        <div id="alert-buku" class="alert"></div>
      </div>

      <!-- TAB KELOLA BUKU -->
      <div id="subtab-buku-manage" class="sub-tab-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <h3 style="font-size: 15px; font-weight: 800;">📚 Daftar Master Buku</h3>
          <button onclick="loadBukuList()" style="padding:6px 12px; cursor:pointer;">🔄 Refresh</button>
        </div>
        <div class="form-group"><input type="text" id="input-search-buku" placeholder="🔍 Cari code, judul, pengarang..." oninput="filterBukuList()"></div>
        <div class="table-container">
          <table>
            <thead><tr><th>ISBN</th><th>Book Code</th><th>Title</th><th>Author</th><th>Aksi</th></tr></thead>
            <tbody id="tabel-buku-body"><tr><td colspan="5" style="text-align: center;">Memuat data...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwck_dnXAjIv1_oTqlvO-kXf0C1XMBi3IOabGah6RJ3tuzf5c4K8P_6YC9j2sCRQBOq/exec";
    let adminHtml5QrCode = null;
    let activeTargetField = null;
    let globalBukuData = [];

    window.addEventListener('DOMContentLoaded', () => {
      setInterval(() => {
        document.getElementById('live-clock').innerText = `🕒 ${new Date().toLocaleString('id-ID', { hour12: false })}`;
      }, 1000);
      loadBukuList();
    });

    function switchSubTab(sub) {
      stopAdminCamera();
      document.getElementById('btn-sub-addbook').classList.toggle('active', sub === 'add');
      document.getElementById('btn-sub-managebook').classList.toggle('active', sub === 'manage');
      document.getElementById('subtab-buku-add').classList.toggle('active', sub === 'add');
      document.getElementById('subtab-buku-manage').classList.toggle('active', sub === 'manage');
      if (sub === 'manage') loadBukuList();
    }

    async function startAdminCamera(targetField) {
      await stopAdminCamera();
      activeTargetField = targetField;
      document.getElementById('box-cam-buku').style.display = 'block';

      // Mendukung SEMUA tipe format barcode/QR universal
      const formats = [
        Html5QrcodeSupportedFormats.QR_CODE,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.ITF,
        Html5QrcodeSupportedFormats.RSS_14
      ];

      adminHtml5QrCode = new Html5Qrcode('reader-admin-buku');
      try {
        await adminHtml5QrCode.start(
          { facingMode: "environment" }, 
          { fps: 20, qrbox: { width: 250, height: 120 }, formatsToSupport: formats }, 
          async (text) => {
            await stopAdminCamera();
            if (activeTargetField === 'isbn') {
              document.getElementById('isbn-buku').value = text.trim();
              showAlert('alert-buku', `✅ ISBN Terbaca: ${text}`, 'success');
            } else if (activeTargetField === 'barcode') {
              document.getElementById('barcode-buku').value = text.trim();
              showAlert('alert-buku', `✅ Book Code Terbaca: ${text}`, 'success');
            }
          }, 
          () => {}
        );
      } catch (e) {
        showAlert('alert-buku', '⚠️ Gagal membuka kamera.', 'danger');
      }
    }

    async function stopAdminCamera() {
      if (adminHtml5QrCode) {
        try {
          if (adminHtml5QrCode.isScanning) await adminHtml5QrCode.stop();
          adminHtml5QrCode.clear();
        } catch (e) {}
        adminHtml5QrCode = null;
      }
      document.getElementById('box-cam-buku').style.display = 'none';
    }

    async function loadBukuList() {
      try {
        const res = await fetch(`${GAS_URL}?action=getAllBooks`).then(r => r.json());
        if (res.success) {
          globalBukuData = res.data || [];
          filterBukuList();
        }
      } catch (e) {}
    }

    function filterBukuList() {
      const keyword = document.getElementById('input-search-buku').value.toLowerCase();
      const filtered = globalBukuData.filter(b => b.barcode.toLowerCase().includes(keyword) || b.judul.toLowerCase().includes(keyword) || b.isbn.toLowerCase().includes(keyword));
      renderBukuTable(filtered);
    }

    function renderBukuTable(data) {
      const tbody = document.getElementById('tabel-buku-body');
      tbody.innerHTML = data.length ? data.map(b => `
        <tr>
          <td>${b.isbn}</td>
          <td><b>${b.barcode}</b></td>
          <td>${b.judul}</td>
          <td>${b.pengarang}</td>
          <td>
            <button onclick="editBuku('${b.isbn}', '${b.barcode}', '${b.judul.replace(/'/g, "\\'")}', '${b.pengarang.replace(/'/g, "\\'")}')">Edit</button>
            <button onclick="deleteBuku('${b.barcode}')">Del</button>
          </td>
        </tr>
      `).join('') : '<tr><td colspan="5" style="text-align: center;">Tidak ada buku.</td></tr>';
    }

    async function submitBuku(e) {
      e.preventDefault();
      const mode = document.getElementById('form-mode-buku').value;
      const payload = {
        action: mode === 'edit' ? 'updateBuku' : 'addBuku',
        isbn: document.getElementById('isbn-buku').value.trim(),
        barcode: document.getElementById('barcode-buku').value.trim(),
        judul: document.getElementById('judul-buku').value.trim(),
        pengarang: document.getElementById('pengarang-buku').value.trim()
      };

      try {
        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) }).then(r => r.json());
        if (res.success) {
          showAlert('alert-buku', res.message, 'success');
          resetBukuForm();
          loadBukuList();
        } else {
          showAlert('alert-buku', res.message, 'danger');
        }
      } catch (err) {
        showAlert('alert-buku', 'Gagal menyimpan buku.', 'danger');
      }
    }

    function editBuku(isbn, barcode, judul, pengarang) {
      switchSubTab('add');
      document.getElementById('form-mode-buku').value = 'edit';
      document.getElementById('buku-form-title').innerText = '✏️ Edit Buku';
      document.getElementById('isbn-buku').value = isbn;
      document.getElementById('barcode-buku').value = barcode;
      document.getElementById('barcode-buku').readOnly = true;
      document.getElementById('judul-buku').value = judul;
      document.getElementById('pengarang-buku').value = pengarang;
      document.getElementById('btn-submit-buku').innerText = 'Update Master Buku';
      document.getElementById('btn-cancel-buku').style.display = 'block';
    }

    function resetBukuForm() {
      document.getElementById('form-mode-buku').value = 'add';
      document.getElementById('buku-form-title').innerText = '📚 Tambah Master Buku';
      document.getElementById('isbn-buku').value = '';
      document.getElementById('barcode-buku').value = '';
      document.getElementById('barcode-buku').readOnly = false;
      document.getElementById('judul-buku').value = '';
      document.getElementById('pengarang-buku').value = '';
      document.getElementById('btn-submit-buku').innerText = 'Simpan Master Buku';
      document.getElementById('btn-cancel-buku').style.display = 'none';
    }

    async function deleteBuku(barcode) {
      if (!confirm(`Hapus buku [${barcode}]?`)) return;
      try {
        await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteBuku', barcode }) });
        loadBukuList();
      } catch (e) {}
    }

    function showAlert(id, msg, type) {
      const el = document.getElementById(id);
      if (el) {
        el.innerText = msg;
        el.className = `alert alert-${type}`;
        el.style.display = 'block';
      }
    }
  </script>
</body>
</html>
